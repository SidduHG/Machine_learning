name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test --if-present
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/verify_examples.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/verify_projects.py
      - run: npm run build
